server {
  listen 80;
  root /usr/share/nginx/html;
  location = / { return 302 /app/; }
  location /app/ { try_files $uri $uri/ /app/index.html; add_header Cache-Control "no-cache"; }
  location /api/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
  location = /api/v1/ws { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}

