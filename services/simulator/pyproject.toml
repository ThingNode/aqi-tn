[project]
name = "aqi-thingsnode-simulator"
version = "0.1.0"
description = "Discardable demo telemetry publisher for aqi.thingsnode"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "paho-mqtt>=2.1"]
license = { text = "Apache-2.0" }

[project.scripts]
aqi-simulator = "simulator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

